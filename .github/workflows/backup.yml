name: Encrypted production backup

on:
  schedule:
    - cron: "25 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PG_DUMP_URL: ${{ secrets.PG_DUMP_URL }}
      AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
    steps:
      - name: Install backup tools
        run: sudo apt-get update && sudo apt-get install --yes age postgresql-client
      - name: Validate backup configuration
        run: |
          test -n "$PG_DUMP_URL"
          test -n "$AGE_RECIPIENT"
          test -n "$R2_ENDPOINT"
          test -n "$R2_BUCKET"
      - name: Create and encrypt dump
        run: |
          set -euo pipefail
          backup_date="$(date -u +%F)"
          pg_dump "$PG_DUMP_URL" --format=custom --no-owner --no-acl --file=logr.dump
          sha256sum logr.dump > logr.dump.sha256
          age --recipient "$AGE_RECIPIENT" --output "logr-${backup_date}.dump.age" logr.dump
          test -s "logr-${backup_date}.dump.age"
          age --recipient "$AGE_RECIPIENT" --output "logr-${backup_date}.sha256.age" logr.dump.sha256
          echo "BACKUP_DATE=$backup_date" >> "$GITHUB_ENV"
      - name: Upload daily backup
        run: |
          aws s3 cp "logr-${BACKUP_DATE}.dump.age" "s3://${R2_BUCKET}/daily/logr-${BACKUP_DATE}.dump.age" --endpoint-url "$R2_ENDPOINT"
          aws s3 cp "logr-${BACKUP_DATE}.sha256.age" "s3://${R2_BUCKET}/daily/logr-${BACKUP_DATE}.sha256.age" --endpoint-url "$R2_ENDPOINT"
      - name: Upload weekly backup on Sunday
        if: ${{ github.event_name == 'schedule' }}
        run: |
          if [ "$(date -u +%u)" = "7" ]; then
            aws s3 cp "logr-${BACKUP_DATE}.dump.age" "s3://${R2_BUCKET}/weekly/logr-${BACKUP_DATE}.dump.age" --endpoint-url "$R2_ENDPOINT"
            aws s3 cp "logr-${BACKUP_DATE}.sha256.age" "s3://${R2_BUCKET}/weekly/logr-${BACKUP_DATE}.sha256.age" --endpoint-url "$R2_ENDPOINT"
          fi

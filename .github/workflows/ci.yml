name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://logr:logr@127.0.0.1:5432/logr
      NEXTAUTH_URL: http://localhost:2206
      NEXTAUTH_SECRET: ci-only-secret-that-is-at-least-32-characters
      ENTRY_KEK: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      GOOGLE_CLIENT_ID: ci-google-client
      GOOGLE_CLIENT_SECRET: ci-google-secret
      GITHUB_ID: ci-github-client
      GITHUB_SECRET: ci-github-secret
      NEXT_PUBLIC_SITE_URL: http://localhost:2206
      PUBLIC_REGISTRATION_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Scan committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm audit --prod --audit-level high
      - run: pnpm lint
      - run: pnpm type:check
      - run: pnpm i18n:check
      - run: pnpm test -- --run
      - run: pnpm build

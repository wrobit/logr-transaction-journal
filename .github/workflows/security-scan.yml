name: Preview security scan

on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: HTTPS URL of the synthetic-data preview deployment
        required: true
        type: string

permissions:
  contents: read

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate target
        env:
          PREVIEW_URL: ${{ inputs.preview_url }}
        run: |
          case "$PREVIEW_URL" in
            https://*.vercel.app|https://preview.*) ;;
            *) echo "Refusing to scan a non-preview target"; exit 1 ;;
          esac
      - name: OWASP ZAP baseline
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ inputs.preview_url }}
          fail_action: true
          allow_issue_writing: false
